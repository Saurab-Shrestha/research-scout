# docker compose up --build   then open http://localhost:8000
# Needs POSTGRES_PASSWORD plus the API keys in .env (see .env.example).
x-app: &app
  build: .
  image: research-scout:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://scout:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/research_scout
  restart: unless-stopped

services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: research_scout
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d research_scout"]
      interval: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    <<: *app
    command: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000  # API + web app
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: python -m app.worker
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  postgres_data:
